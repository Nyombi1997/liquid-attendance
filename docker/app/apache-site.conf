Listen 8443

ServerTokens Prod
ServerSignature Off

<VirtualHost *:8443>
    ServerName localhost
    DocumentRoot /var/www/app/public

    SSLEngine on
    SSLCertificateFile    /certs/fullchain.pem
    SSLCertificateKeyFile /certs/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1


    <Directory /var/www/app/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    Header always set Strict-Transport-Security "max-age=15552000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; form-action 'self'"

    # Fichiers statiques versionnés (/assets/…?v=<date de modification>, helper
    # asset()) : contenu figé pour une URL donnée, donc cache d'un an.
    <If "%{REQUEST_URI} =~ m#^/assets/# && %{QUERY_STRING} =~ /(^|&)v=/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </If>

    <Files "sw.js">
        Header set Cache-Control "no-cache"
        Header set Service-Worker-Allowed "/"
    </Files>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
